name: Matrix Demo
on: push 
jobs:
  build:
    strategy:
      matrix: 
        node-version: [12,14,16]
        operating-system: [ubuntu-latest, windows-latest]
        # These keywords allows us to specifically run node versions on operatinf systems
        include: 
          - node-version: 18
            operating-system: ubuntu-latest
        exclude: 
          - node-version: 12
            operating-system: windows-latest
    # Making the runner dynamic
    # This is run on parallel
    # Runs all combination of the matrix
    runs-on: ${{ matrix.operating-system }}
    steps: 
      - name: Get code
        uses: actions/checkout@v4
      - name: Install NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-versions }}
      - name: Install dependencies
        run: npm ci
      - name: Build projects
        run: npm run build